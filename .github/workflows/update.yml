name: MTK adatok frissítése

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Szükséges csomagok telepítése
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: MTK adatok frissítése
        run: |
          mkdir -p data
          python update_mtk.py

      - name: Frissített adatok mentése
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mtk.json
          git diff --cached --quiet || git commit -m "MTK adatok frissítése"
          git push
